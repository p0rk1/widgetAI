# Konfiguracja Workera knowbase-budmax.
#
# Odwzorowuje stan ustawiony wcześniej ręcznie w dashboardzie — data
# kompatybilności i wszystkie trzy bindingi są przepisane z wersji
# cccc273c (sprawdzone przez `wrangler versions view`). Deploy traktuje
# ten plik jako źródło prawdy: czego tu nie ma, to zniknie z Workera.
#
# REINDEX_SECRET celowo NIE jest tutaj wymieniony. Sekrety ustawia się
# osobno (`wrangler secret put REINDEX_SECRET --name knowbase-budmax`)
# i przeżywają deploy — wpisanie ich do repo zniweczyłoby cały sens
# przeniesienia klucza poza kod.

name = "knowbase-budmax"
main = "worker.js"
compatibility_date = "2026-08-04"

# Stary adres knowbase-budmax.rezi7608.workers.dev ZOSTAJE włączony.
# Odwołują się do niego na sztywno index.html i panel.html (stała WORKER_URL),
# więc wyłączenie go zerwałoby działający widget i panel w tej samej sekundzie.
# Migracja widgetu na adres własnej domeny to osobna, świadoma zmiana.
workers_dev = true

# Bez tego Cloudflare wystawia każdą wersję pod osobnym adresem podglądu.
# Widget i tak chodzi wyłącznie z listy ALLOWED_ORIGINS, więc to była tylko
# dodatkowa powierzchnia bez zastosowania.
preview_urls = false

# UWAGA NA KOLEJNOŚĆ: wszystko poniżej pierwszej tabeli ([[routes]], [vars], …)
# należy już do tej tabeli, nie do konfiguracji głównej. Klucze najwyższego
# poziomu — name, main, workers_dev, preview_urls — muszą zostać tutaj, nad nimi.

# Konfiguracja Cloudflare Zero Trust Access dla endpointu /internal.
# To NIE są sekrety — identyfikator odbiorcy (AUD) i nazwa zespołu są jawne,
# a bezpieczeństwo daje weryfikacja podpisu, nie tajność tych wartości.
# Dlatego mieszkają tutaj, a nie w `wrangler secret`: deploy z CLI i tak
# traktuje ten plik jako źródło prawdy, więc wpis w dashboardzie by zniknął.
#
# Puste wartości = tryb wewnętrzny wyłączony. /internal zwraca wtedy 503
# z wyjaśnieniem, czego brakuje (nie milczące 403). Wypełnij po utworzeniu
# aplikacji w Zero Trust — instrukcja krok po kroku w ZERO-TRUST.md.
[vars]
ACCESS_TEAM_DOMAIN = "knowbase.cloudflareaccess.com"
ACCESS_AUD = "31995d69e22347f8708921b157570232f11113d68beb57edb35b2773f782c1c0"  # aplikacja "BudMax — tryb wewnętrzny"

# AUD drugiej aplikacji Access — "BudMax — panel właściciela", host właściciela.
# Osobna aplikacja, bo polityka jest inna: zespół kontra jedna osoba. Worker
# wybiera oczekiwany AUD po HOŚCIE, więc token pracownika nie otworzy panelu.
# Puste = panel wyłączony: /stats i /stats-internal zwrócą 503 z nazwą brakującej
# zmiennej, nie milczące 403.
ACCESS_AUD_PANEL = "49c77c8db986774c2b12555dbffed0da65324ce50f695a64fe5e8df9e4ddb133"  # aplikacja "BudMax — panel właściciela"

# DRUGI KLIENT — kancelaria. Nazwy tych zmiennych są wpisane w `audVars`
# w klienci.js i muszą się zgadzać co do znaku.
#
# PUSTE = ochrona jeszcze nie istnieje, i to jest stan bezpieczny: hosty
# pracowniczy i właścicielski kancelarii oddadzą wtedy 503 z nazwą brakującej
# zmiennej, a nie interfejs bez ochrony. Wypełnij AUD-ami dwóch aplikacji
# Access — krok po kroku w ZERO-TRUST.md, krok 10.
ACCESS_AUD_KANCELARIA = ""        # aplikacja "Kancelaria — tryb wewnętrzny"
ACCESS_AUD_KANCELARIA_PANEL = ""  # aplikacja "Kancelaria — panel właściciela"

# TRYB DEMONSTRACYJNY — wyłącznie na potrzeby prezentacji.
#
# Przy DEMO = "1" interfejsy pracownicze i panele dostają na dole dyskretny pasek
# z linkami do hostów drugiego klienta. To narzędzie prezentacyjne, nie funkcja
# produktu: przy wdrożeniu u prawdziwego klienta ta zmienna ma ZNIKNĄĆ z pliku,
# a nie zostać ustawiona na "0". Wtedy paska nie ma fizycznie w wysłanym HTML-u —
# nie jest ukryty stylem ani warunkiem w JavaScripcie, który da się obejść konsolą.
#
# Sam pasek to lista LINKÓW, a nie kontrolka zmieniająca stan: klient nadal
# wynika z hosta, więc kliknięcie zmienia adres, a nie przeszukiwaną przestrzeń.
DEMO = "1"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "aeead86f2597488bacbad23b8fe5317a"

[[vectorize]]
binding = "VECTORIZE"
index_name = "budmax-knowledge"

# Własna domena, dwa hosty na klienta. Rozdzielenie jest celowe: aplikacja
# Access obejmuje CAŁY host wewnętrzny, więc nie ma tam ścieżki publicznej,
# którą dałoby się przypadkiem odsłonić albo zablokować.
#
# Oba hosty są jednopoziomowe — pokrywa je darmowy certyfikat *.know-base.app.
# Zejście poziom niżej (internal.budmax.know-base.app) wymagałoby płatnego
# certyfikatu, dlatego myślnik zamiast kropki.
#
# Kolejnego klienta dodaje się dwoma takimi wpisami plus jego domenami
# w ALLOWED_ORIGINS w worker.js. Gwiazdki (*.know-base.app) celowo NIE ma:
# Worker jest jednodzierżawny, więc dowolna nieistniejąca subdomena
# odpowiadałaby dziś dokumentacją BudMaksu.
[[routes]]
pattern = "budmax.know-base.app"
custom_domain = true

[[routes]]
pattern = "budmax-pracownik.know-base.app"
custom_domain = true

# Host właściciela — oba panele analityczne, cały za własną aplikacją Access.
# Trzeci host na klienta, nie ścieżka na hoście pracowniczym: rola wynika wtedy
# z adresu, a nie z pola `Path` w polityce ani z listy e-maili w kodzie.
[[routes]]
pattern = "budmax-wlasciciel.know-base.app"
custom_domain = true

# ------------------------------------------------------------
# Trasy drugiego klienta — kancelaria.
#
# KOLEJNOŚĆ JEST REGUŁĄ, nie preferencją: host w `wrangler.toml` i host
# w Access zmienia się razem, a jeśli osobno — to NAJPIERW kod i trasy.
# Tutaj jest to bezpieczne, bo `ACCESS_AUD_KANCELARIA*` są puste, więc
# `odpowiedzBrakKonfiguracji()` nie wyda ani `/app`, ani `/panel`, ani `GET /`.
# Odwrotna kolejność (Access przed trasą) zostawiłaby aplikację Access
# wskazującą na host, którego Worker nie obsługuje.
#
# Host publiczny aplikacji Access NIE MA i mieć nie może — to bot dla klientów.
[[routes]]
pattern = "kancelaria.know-base.app"
custom_domain = true

[[routes]]
pattern = "kancelaria-pracownik.know-base.app"
custom_domain = true

[[routes]]
pattern = "kancelaria-wlasciciel.know-base.app"
custom_domain = true
